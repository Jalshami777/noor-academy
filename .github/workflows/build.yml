name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify project files
        run: |
          ls -la
          cat package.json | head -n 30
          cat capacitor.config.ts 2>/dev/null || cat capacitor.config.json 2>/dev/null || echo "no capacitor config"

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: |
          if grep -q '"build"' package.json; then
            npm run build
          else
            echo "skip build - no build script"
          fi

      - name: Verify Capacitor
        run: npx cap --version

      - name: Create Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "android folder exists"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-academy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
