
name: Build Noor Academy APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify project files
        run: |
          test -f package.json || {
            echo "ERROR: package.json not found in repository root"
            exit 1
          }

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Verify Capacitor
        run: |
          test -f capacitor.config.json || {
            test -f capacitor.config.ts || {
              echo "ERROR: Capacitor config not found"
              exit 1
            }
          }
          npm ls @capacitor/core
          npm ls @capacitor/android

      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          test -d android || {
            echo "ERROR: Android directory was not created"
            exit 1
          }

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          test -f android/gradlew || {
            echo "ERROR: Gradle wrapper not found"
            exit 1
          }
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-academy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
