<script>
(() => {
  // Installable app shell; the browser offers installation where supported.
  let installEvent = null;
  const lang = () => document.documentElement.lang === 'ar' ? 'ar' : 'en';
  const copy = {
    ar: { install: 'تثبيت التطبيق', offline: 'أنت تعمل الآن دون اتصال. ستبقى الواجهة متاحة.', online: 'عاد الاتصال بالإنترنت.' },
    en: { install: 'Install app', offline: 'You are offline. The app shell remains available.', online: 'You are back online.' }
  };
  const message = (key) => (copy[lang()] || copy.en)[key];
  const showToast = (text) => {
    let el = document.getElementById('noor-pwa-toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'noor-pwa-toast';
      el.style.cssText = 'position:fixed;z-index:99999;bottom:18px;left:50%;transform:translateX(-50%);max-width:90vw;padding:12px 18px;border-radius:14px;background:#0F2340;color:#fff;font:600 14px/1.5 system-ui;box-shadow:0 8px 28px #0003;text-align:center;transition:opacity .2s';
      document.body.appendChild(el);
    }
    el.textContent = text;
    el.style.opacity = '1';
    clearTimeout(el._hide);
    el._hide = setTimeout(() => el.style.opacity = '0', 3200);
  };
  const install = document.createElement('button');
  install.type = 'button';
  install.id = 'noor-install-app';
  install.textContent = message('install');
  install.style.cssText = 'display:none;position:fixed;z-index:9998;bottom:18px;right:18px;padding:11px 16px;border:0;border-radius:999px;background:#F2B705;color:#0F2340;font:800 13px system-ui;box-shadow:0 5px 18px #0002;cursor:pointer';
  install.addEventListener('click', async () => {
    if (!installEvent) { showToast(message('install')); return; }
    installEvent.prompt();
    await installEvent.userChoice;
    installEvent = null;
    install.style.display = 'none';
  });
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(install));
  window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    installEvent = event;
    install.textContent = message('install');
    install.style.display = 'block';
  });
  window.addEventListener('appinstalled', () => {
    install.style.display = 'none';
    showToast(lang()==='ar' ? 'تم تثبيت منصة نور.' : 'Noor Academy has been installed.');
  });
  window.addEventListener('offline', () => showToast(message('offline')));
  window.addEventListener('online', () => showToast(message('online')));
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
  }
  // Keep direction and document language correct after language changes.
  const syncDirection = () => {
    const isArabic = document.documentElement.lang === 'ar';
    document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
    install.textContent = message('install');
  };
  new MutationObserver(syncDirection).observe(document.documentElement, {attributes:true,attributeFilter:['lang','dir']});
  syncDirection();
})();
</script>
